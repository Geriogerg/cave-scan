<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titre %}cave-scan{% endblock %} — cave-scan</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
  {% block tete %}{% endblock %}
</head>
<body class="{% block classe %}{% endblock %}">
  <header class="entete">
    <a href="/app" class="marque">cave-scan</a>
    {% block fil %}{% endblock %}
  </header>
  <main class="contenu">
    {% block contenu %}{% endblock %}
  </main>
  {% block actions %}{% endblock %}
  {% block scripts %}{% endblock %}
  <script>
    /* Toute réponse 500 à une action HTMX se dit, en français, au lieu d'un
       écran qui ne bouge pas (rapport du testeur, T2-1). */
    document.addEventListener("htmx:responseError", function (e) {
      if (e.detail.xhr.status < 500 || document.getElementById("indicateur")) return;  // la relecture a son propre message
      var zone = document.getElementById("erreur-serveur");
      if (!zone) {
        zone = document.createElement("p");
        zone.id = "erreur-serveur";
        zone.className = "message alerte";
        zone.setAttribute("role", "alert");
        document.querySelector("main").prepend(zone);
      }
      zone.textContent = "L'opération n'a pas abouti : erreur inattendue du serveur. Vérifiez votre saisie et réessayez.";
      zone.scrollIntoView({ block: "center" });
    });
  </script>
</body>
</html>
