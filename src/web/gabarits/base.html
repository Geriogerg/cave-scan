<!doctype html>
<html lang="fr">

  <title>{% block titre %}cave-scan{% endblock %} — cave-scan</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
  {% block tete %}{% endblock %}
</head>
<body class="{% block classe %}{% endblock %}">

  {% block scripts %}{% endblock %}
</body>
</html>
