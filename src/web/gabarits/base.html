<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titre %}cave-scan{% endblock %} — cave-scan</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
  {% block tete %}{% endblock %}
</head>
<body class="{% block classe %}{% endblock %}">
  <header class="entete">
    <a href="/app" class="marque">cave-scan</a>
    {% block fil %}{% endblock %}
  </header>
  <main class="contenu">
    {% block contenu %}{% endblock %}
  </main>
  {% block actions %}{% endblock %}
  {% block scripts %}{% endblock %}
  <script>
    /* Toute réponse 500 à une action HTMX se dit, en français, au lieu d'un
       écran qui ne bouge pas (rapport du testeur, T2-1). */
    function signaler(texte) {
      var zone = document.getElementById("erreur-serveur");
      if (!zone) {
        zone = document.createElement("p");
        zone.id = "erreur-serveur";
        zone.className = "message alerte";
        zone.setAttribute("role", "alert");
        document.querySelector("main").prepend(zone);
      }
      zone.textContent = texte;
      zone.scrollIntoView({ block: "center" });
    }
    /* Coupure réseau ou délai dépassé : l'action n'a pas été faite, et l'écran le dit
       (Vérifier, Configuration… ; la relecture a son propre message, T4-B5). */
    ["htmx:sendError", "htmx:timeout"].forEach(function (nom) {
      document.addEventListener(nom, function (e) {
        if (document.getElementById("indicateur")) return;
        signaler("Connexion interrompue : l'action n'a pas été faite. Vérifiez le réseau et réessayez.");
        // Une quantité de « Vérifier » : le champ garde la saisie, la carte dit qu'elle
        // n'est pas enregistrée (T5-D2).
        var formulaire = e.target && e.target.closest ? e.target.closest(".quantite-attente") : null;
        if (formulaire && !formulaire.querySelector(".non-enregistree")) {
          var avis = document.createElement("span");
          avis.className = "alerte-texte non-enregistree";
          avis.setAttribute("role", "alert");
          avis.textContent = "Pas enregistrée (connexion interrompue) : réessayez.";
          formulaire.appendChild(avis);
        }
      });
    });
    /* Un formulaire classique (créer, rouvrir, corbeille…) ne part qu'une fois :
       un double appui ne crée pas deux inventaires (T4-B7). */
    document.addEventListener("submit", function (e) {
      var formulaire = e.target;
      if (e.defaultPrevented || formulaire.hasAttribute("hx-post")) return;  // annulé (confirmation refusée) ou HTMX
      if (formulaire.dataset.envoye) { e.preventDefault(); return; }
      formulaire.dataset.envoye = "1";
    });
    document.addEventListener("htmx:responseError", function (e) {
      if (e.detail.xhr.status < 500 || document.getElementById("indicateur")) return;  // la relecture a son propre message
      var zone = document.getElementById("erreur-serveur");
      if (!zone) {
        zone = document.createElement("p");
        zone.id = "erreur-serveur";
        zone.className = "message alerte";
        zone.setAttribute("role", "alert");
        document.querySelector("main").prepend(zone);
      }
      zone.textContent = "L'opération n'a pas abouti : erreur inattendue du serveur. Vérifiez votre saisie et réessayez.";
      zone.scrollIntoView({ block: "center" });
    });
  </script>
</body>
</html>
