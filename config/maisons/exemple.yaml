# Format de sortie d'UNE maison de vente. Une maison = un fichier comme celui-ci,
# jamais une sous-classe (decisions.md 0011).
#
# TEMPLATE : à ajuster sur le VRAI listing de la maison quand il arrivera
# (en-têtes exacts, ordre des colonnes, libellés maison). Ne pas deviner ses
# conventions ici — c'est une question ouverte de decisions.md.

maison: Maison Exemple

# Déclarative : portée dans les propriétés du document. Les libellés affichés
# sont explicites ci-dessous, ils ne sont pas déduits de cette valeur.
langue: fr

feuille:
  titre: Catalogue
  police: Arial
  taille_police: 10
  figer_entetes: true

# Lignes dont `champs_a_verifier` n'est pas vide : file de relecture humaine.
# Couleur RGB hexadécimale, ou `null` pour ne pas surligner.
surlignage_a_verifier: "FFF2CC"

# Comment les abstentions du modèle s'écrivent dans le fichier livré.
# Ce sont des valeurs correctes, pas des trous : elles s'affichent, elles ne
# se cachent pas (decisions.md 0002).
libelles:
  non_lisible: non lisible
  non_determinable: non déterminable
  numerique_absent: non lisible

# `champ` = nom d'un champ de `Bouteille`, ou `null` pour une colonne que le
# modèle ne remplit pas (elle sort vide, à la main de la maison).
colonnes:
  - entete: Lot
    champ: null
    largeur: 6

  - entete: Domaine / Producteur
    champ: domaine
    largeur: 30

  - entete: Appellation
    champ: appellation
    largeur: 30

  - entete: Cuvée
    champ: cuvee
    largeur: 22

  - entete: Couleur
    champ: couleur
    largeur: 12

  - entete: Couleur (source)
    champ: couleur_source
    largeur: 15

  - entete: Effervescence
    champ: effervescence
    largeur: 14

  - entete: Millésime
    champ: millesime
    largeur: 11

  - entete: Région
    champ: region
    largeur: 18

  - entete: Pays
    champ: pays
    largeur: 12

  - entete: Format
    champ: format
    largeur: 16

  - entete: Contenance (cl)
    champ: contenance_cl
    largeur: 14

  - entete: Degré (% vol.)
    champ: degre
    largeur: 13

  - entete: Importateur
    champ: importateur
    largeur: 22

  # VIDE par construction : le modèle ne produit aucun prix (decisions.md 0005).
  # La colonne existe pour que le fichier ait la forme attendue par la maison.
  - entete: Estimation
    champ: null
    largeur: 14

  - entete: À vérifier
    champ: champs_a_verifier
    largeur: 26

  - entete: Notes
    champ: notes
    largeur: 45
